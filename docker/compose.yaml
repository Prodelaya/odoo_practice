services:
  db:
    image: postgres:16
    env_file:
      - ./.env
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks:
      - odoo-net

  odoo:
    image: odoo:19
    depends_on:
      - db
    ports:
      - "8069:8069"
    volumes:
      - odoo_data:/var/lib/odoo
      - /home/prodelaya/proyectos/odoo_practice/custom_addons:/mnt/extra-addons
      - ./odoo.conf:/etc/odoo/odoo.conf
    environment:
      - ODOO_EXTRA_ADDONS=/mnt/extra-addons
    networks:
      - odoo-net

volumes:
  pgdata:
  odoo_data:

networks:
  odoo-net:
